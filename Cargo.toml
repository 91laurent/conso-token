[workspace]
members = ["noyau", "appli"]
resolver = "3"

[workspace.package]
version = "1.2.1"
edition = "2024"
rust-version = "1.99"
publish = false

# Le profil de publication est celui du prototype : petit exécutable, sans symboles.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
